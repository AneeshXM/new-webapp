services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fifa-world-cup-2026
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      # Free APIs (no credit card required)
      - FOOTBALL_DATA_KEY=${FOOTBALL_DATA_KEY:-}
      - GNEWS_API_KEY=${GNEWS_API_KEY:-}
      # Optional premium APIs
      - API_FOOTBALL_KEY=${API_FOOTBALL_KEY:-}
      - NEWSDATA_API_KEY=${NEWSDATA_API_KEY:-}
      - CURRENTS_API_KEY=${CURRENTS_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - fifa-network

networks:
  fifa-network:
    driver: bridge
